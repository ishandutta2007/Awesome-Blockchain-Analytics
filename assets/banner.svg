<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Glowing Text & Element Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 54px;
      fill: url(#titleGrad);
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 22px;
      fill: #94a3b8;
      letter-spacing: 1px;
    }
    .tagline {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 15px;
      fill: #38bdf8;
      letter-spacing: 2.5px;
      text-transform: uppercase;
    }
    
    /* Animations */
    @keyframes pulseParticle {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.4); }
    }

    @keyframes dashMove {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes floatNode {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .node-1 { animation: floatNode 4s ease-in-out infinite; }
    .node-2 { animation: floatNode 5s ease-in-out infinite 1s; }
    .node-3 { animation: floatNode 4.5s ease-in-out infinite 2s; }
    
    .connection-line {
      stroke: #6366f1;
      stroke-width: 1.5;
      stroke-dasharray: 6, 6;
      opacity: 0.4;
      animation: dashMove 20s linear infinite;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)" />
  <rect width="1196" height="296" x="2" y="2" rx="14" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.6" />

  <!-- Background Grid Network / Dynamic Graphics in background -->
  <g opacity="0.25">
    <!-- Graph Lines -->
    <path d="M 100 220 L 250 120 L 400 180 L 600 80 L 800 200 L 1000 100 L 1120 220" fill="none" stroke="url(#lineGrad)" stroke-width="2" />
    <path d="M 80 80 L 220 200 L 450 100 L 700 220 L 950 140 L 1100 70" fill="none" stroke="url(#lineGrad)" stroke-width="1.5" stroke-dasharray="4,4" />
    
    <!-- Background Animated Nodes -->
    <circle cx="250" cy="120" r="6" fill="#38bdf8" class="node-1" />
    <circle cx="400" cy="180" r="8" fill="#818cf8" class="node-2" />
    <circle cx="600" cy="80" r="7" fill="#c084fc" class="node-3" />
    <circle cx="800" cy="200" r="9" fill="#38bdf8" class="node-1" />
    <circle cx="1000" cy="100" r="6" fill="#818cf8" class="node-2" />
  </g>

  <!-- Decorative Glowing Side Accent Orbs (Behind Text) -->
  <circle cx="150" cy="150" r="120" fill="#6366f1" opacity="0.15" filter="url(#glow)" />
  <circle cx="1050" cy="150" r="140" fill="#a855f7" opacity="0.15" filter="url(#glow)" />

  <!-- Foreground Content Block (Ensures titles are sharp & never obscured) -->
  <g transform="translate(600, 150)" text-anchor="middle">
    <!-- Tagline Badge -->
    <rect x="-170" y="-105" width="340" height="32" rx="16" fill="url(#accentGrad)" stroke="#818cf8" stroke-width="1" opacity="0.9" />
    <text y="-84" class="tagline">⚡ ON-CHAIN INTELLIGENCE &amp; AML</text>

    <!-- Main Title -->
    <text y="-20" class="title" filter="url(#glow)">Awesome Blockchain Analytics</text>
    
    <!-- Subtitle -->
    <text y="32" class="subtitle">Curated SaaS Platforms, Open-Source Forensics &amp; Indexing Toolchains</text>

    <!-- Sub-badges / Tech Highlights -->
    <g transform="translate(0, 75)" font-family="system-ui, sans-serif" font-size="13" font-weight="600">
      <!-- Item 1 -->
      <g transform="translate(-240, 0)">
        <rect x="-60" y="-14" width="120" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text y="4" fill="#38bdf8" text-anchor="middle">🔍 Forensics</text>
      </g>
      <!-- Item 2 -->
      <g transform="translate(-80, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text y="4" fill="#a855f7" text-anchor="middle">🛡️ AML &amp; Compliance</text>
      </g>
      <!-- Item 3 -->
      <g transform="translate(80, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text y="4" fill="#34d399" text-anchor="middle">⚡ Multichain Indexing</text>
      </g>
      <!-- Item 4 -->
      <g transform="translate(240, 0)">
        <rect x="-60" y="-14" width="120" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text y="4" fill="#fbbf24" text-anchor="middle">📊 SQL Warehouses</text>
      </g>
    </g>
  </g>
</svg>
